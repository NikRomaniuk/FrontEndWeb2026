<ion-header [translucent]="true">
  <ion-toolbar>
    <!-- Add buttons in header of the page -->
    <!-- "Start" for positioning -->
    <ion-buttons slot="start">
      <!-- Back arrow -->
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title>Ulster</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Ulster</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Add an image -->
  <img src="https://upload.wikimedia.org/wikipedia/commons/7/7e/Flag_of_Ulster.svg">
</ion-content>
